# Respaldo diario de la base de datos de Gata Maula (Supabase) en este repositorio privado.
# Cada dia (04:00 hora Argentina) guarda una copia completa y la sube como un commit nuevo:
# el historial de GitHub conserva TODOS los dias, para siempre, y se puede volver a cualquiera.
# Necesita un secreto del repositorio llamado SUPABASE_DB_URL (ver README.md).
name: Respaldo diario

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: respaldo

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pg_dump de la misma version que la base
        run: |
          set -e
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Falta el secreto SUPABASE_DB_URL"; exit 1; fi
          V=$(psql "$SUPABASE_DB_URL" -Atc "show server_version_num")
          MAJOR=$((V / 10000))
          echo "La base es Postgres $MAJOR"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-$MAJOR
          echo "PGBIN=/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_ENV"

      - name: Hacer la copia
        run: |
          set -e
          mkdir -p datos
          [ -f datos/conteos.txt ] && cp datos/conteos.txt "$RUNNER_TEMP/conteos_anterior.txt" || : > "$RUNNER_TEMP/conteos_anterior.txt"

          # estructura: tablas, funciones, permisos (RLS) y triggers
          "$PGBIN/pg_dump" "$SUPABASE_DB_URL" --schema=public --schema-only --no-owner --no-privileges -f datos/estructura.sql

          # datos de la app + los usuarios con los que se entra (auth.users y auth.identities), todo del mismo instante
          if ! "$PGBIN/pg_dump" "$SUPABASE_DB_URL" --data-only --no-owner --no-privileges \
                 --schema=public --table=auth.users --table=auth.identities -f datos/datos.sql; then
            echo "::warning::No se pudieron incluir los usuarios de login (auth). Se guardan solo los datos de la app."
            "$PGBIN/pg_dump" "$SUPABASE_DB_URL" --data-only --no-owner --no-privileges --schema=public -f datos/datos.sql
          fi

          # cantidad de filas de cada tabla (sirve para detectar si de golpe desaparecen datos)
          psql "$SUPABASE_DB_URL" -Atc "select table_name || ': ' || (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), false, true, '')))[1]::text from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE' order by 1" > datos/conteos.txt

          # control: una copia casi vacia no se guarda
          if [ "$(stat -c %s datos/datos.sql)" -lt 20000 ]; then echo "::error::La copia salio demasiado chica, no se guarda"; exit 1; fi
          if [ "$(stat -c %s datos/estructura.sql)" -lt 5000 ]; then echo "::error::La estructura salio demasiado chica, no se guarda"; exit 1; fi

          date -u '+%Y-%m-%d %H:%M UTC' > datos/ultimo-respaldo.txt

      - name: Guardar en el historial
        run: |
          set -e
          git config user.name "respaldo-automatico"
          git config user.email "respaldo@users.noreply.github.com"
          git add -A
          git commit -m "Respaldo $(date -u +%F)"
          git push

      - name: Avisar si desaparecieron datos
        run: |
          # si una tabla con 50 filas o mas perdio mas del 30% desde ayer, este paso falla y GitHub te manda un mail
          awk -F': ' 'NR == FNR { ant[$1] = $2; next } ($1 in ant) && ant[$1] >= 50 && $2 < ant[$1] * 0.7 { print "ATENCION " $1 ": antes " ant[$1] ", ahora " $2; bad = 1 } END { exit bad }' "$RUNNER_TEMP/conteos_anterior.txt" datos/conteos.txt
